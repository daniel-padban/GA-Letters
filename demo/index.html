<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <script src="script.js" defer></script>
    <style>
        .allt{
            align-items: center;
            text-align: center;
        }
        #results{
            width: 100;
        }

<body>
    <div class="allt">
        
        <canvas id="drawCanvas" width="280" height="280" style="border:1px solid #000000;"></canvas>
        <br>
        <button id="clearCanvas" onclick="clearCanvas()">Clear</button>
        <br>
        <label for="dropdown">Choose an option:</label>
        <select id="dropdown" onchange="selectModel(this.value)">
            <option value="Demo-12000">Modell 12000</option>
            <option value="Demo-6000">Modell 6000</option>
            <option value="Demo-4000">Modell 4000</option>
            <option value="Demo-3000">Modell 3000</option>
            <option value="Demo-2400">Modell 2400</option>
            <option value="Demo-2000">Modell 2000</option>
            <option value="Demo-1500">Modell 1500</option>
            <option value="Demo-1200">Modell 1200</option>
            <option value="Demo-1000">Modell 1000</option>
            <option value="Demo-800">Modell 800</option>
        </select>
        <ol id="results" class="allt"></ol>
    </div>
</body>
</html>
